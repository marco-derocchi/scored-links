<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Scored App</title>
  <meta name="description" content="Open Scored App" />
  <meta property="og:title" content="Open Scored App" />
  <meta property="og:description" content="Open Scored App" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000000;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var appId = "com.scoredlabs.scored";
      var appStoreSearchUrl = "https://apps.apple.com/us/search?term=Scored";
      var defaultAndroidInstallUrl = "https://groups.google.com/g/scored-prototype-users";
      var defaultIOSInstallUrl = "https://testflight.apple.com/join/fj2Bv28x";
      var params = new URLSearchParams(window.location.search);
      var payload = params.toString();
      var installUrlParam = params.get("installUrl");
      var installUrl = installUrlParam ? decodeURIComponent(installUrlParam) : "";
      var iosInstallUrl = "";
      var installTargetUrl = "/install-target.json";
      var userAgent = navigator.userAgent || "";
      var isAndroid = /Android/i.test(userAgent);
      var isIOS =
        /iPhone|iPad|iPod|CriOS|FxiOS|EdgiOS/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
        (/AppleWebKit/i.test(userAgent) && /Mobile/i.test(userAgent) && !isAndroid);
      var launchStartedAt = Date.now();
      var timers = [];
      var didUnload = false;

      function getInstallDestination() {
        if (isIOS) {
          return iosInstallUrl || defaultIOSInstallUrl || appStoreSearchUrl;
        }

        if (installUrl) {
          return installUrl;
        }

        return defaultAndroidInstallUrl;
      }

      function getIOSSafeInstallDestination() {
        var destination = getInstallDestination();
        if (/groups\.google\.com\/g\/scored-prototype-users/i.test(destination)) {
          return defaultIOSInstallUrl || appStoreSearchUrl;
        }

        return destination;
      }

      function resolveInstallLinkFromConfig() {
        if (installUrlParam) {
          return;
        }

        fetch(installTargetUrl, { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) {
              return null;
            }

            return response.json();
          })
          .then(function (config) {
            if (config && typeof config.installUrl === "string" && config.installUrl) {
              installUrl = config.installUrl;
            }

            if (config && typeof config.iosInstallUrl === "string" && config.iosInstallUrl) {
              iosInstallUrl = config.iosInstallUrl;
            }
          })
          .catch(function () {});
      }

      // App Link and fallback scheme carry the same query payload.
      var appLink = "https://links.scoredlabs.com/pair" + (payload ? "?" + payload : "");
      var schemeLink = "scored://pair" + (payload ? "?" + payload : "");
      var currentNoHash = window.location.href.split("#")[0];
      var appLinkNoHash = appLink.split("#")[0];
      var shouldAttemptAppLink = currentNoHash !== appLinkNoHash;

      // Keep payload through Play referrer so backend/app can recover context.
      var referrerValue = encodeURIComponent("utm_source=qr" + (payload ? "&" + payload : ""));
      var playStoreMarket = "market://details?id=" + appId;
      var playStoreDetails = "https://play.google.com/store/apps/details?id=" + appId + "&referrer=" + referrerValue;
      var playStoreSearch = "https://play.google.com/store/search?q=" + encodeURIComponent(appId) + "&c=apps";
      var playStoreIntent =
        "intent://details?id=" +
        encodeURIComponent(appId) +
        "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";
      var playStore = playStoreIntent;
      var intentLink =
        "intent://pair" +
        (payload ? "?" + payload : "") +
        "#Intent;scheme=scored;package=" +
        appId +
        ";S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";
      resolveInstallLinkFromConfig();

      function scheduleRedirect(urlOrResolver, delay, allowWhenResumed) {
        var timer = setTimeout(function () {
          if (didUnload) {
            return;
          }

          // If the page spent time in background (app switch), do not fire late fallbacks.
          var elapsed = Date.now() - launchStartedAt;
          if (!allowWhenResumed && elapsed > delay + 1500) {
            return;
          }

          var url = typeof urlOrResolver === "function" ? urlOrResolver() : urlOrResolver;
          window.location.replace(url);
        }, delay);
        timers.push(timer);
      }

      function stopTimers() {
        for (var i = 0; i < timers.length; i++) {
          clearTimeout(timers[i]);
        }
        timers = [];
      }

      window.addEventListener("pagehide", function () {
        didUnload = true;
        stopTimers();
      });

      // Avoid reloading the same landing URL (can cause loops/freezes on some browsers).
      if (shouldAttemptAppLink) {
        window.location.replace(appLink);
      }

      if (isAndroid) {
        // Try custom scheme first to avoid browser fallback behavior from intent URLs.
        scheduleRedirect(schemeLink, 300, false);

        // If still on page, send users to the shared install link when available.
        scheduleRedirect(function () {
          return installUrl || defaultAndroidInstallUrl || playStore;
        }, 1600, false);
        return;
      }

      if (isIOS) {
        // On iOS, attempt custom scheme and then App Store fallback.
        scheduleRedirect(schemeLink, 450, false);
        scheduleRedirect(function () {
          return getIOSSafeInstallDestination();
        }, 2600, false);
        return;
      }

      // Desktop or unknown platform: keep page blank without forced redirects.
    })();

  </script>
</body>
</html>
