<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title></title>
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <style>
    body { margin: 0; background: #ffffff; }
  </style>
</head>
<body>

  <script>
    (function () {
      var appId = "com.scoredlabs.scored";
      var appStoreSearchUrl = "https://apps.apple.com/us/search?term=Scored";
      var params = new URLSearchParams(window.location.search);
      var payload = params.toString();
      var userAgent = navigator.userAgent || "";
      var isAndroid = /Android/i.test(userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(userAgent);
      var launchStartedAt = Date.now();
      var timers = [];
      var didUnload = false;

      // App Link and fallback scheme carry the same query payload.
      var appLink = "https://links.scoredlabs.com/pair" + (payload ? "?" + payload : "");
      var schemeLink = "scored://pair" + (payload ? "?" + payload : "");
      var currentNoHash = window.location.href.split("#")[0];
      var appLinkNoHash = appLink.split("#")[0];
      var shouldAttemptAppLink = currentNoHash !== appLinkNoHash;

      // Keep payload through Play referrer so backend/app can recover context.
      var referrerValue = encodeURIComponent("utm_source=qr" + (payload ? "&" + payload : ""));
      var playStoreMarket = "market://details?id=" + appId;
      var playStoreDetails = "https://play.google.com/store/apps/details?id=" + appId + "&referrer=" + referrerValue;
      var playStoreSearch = "https://play.google.com/store/search?q=" + encodeURIComponent(appId) + "&c=apps";
      var playStoreIntent =
        "intent://details?id=" +
        encodeURIComponent(appId) +
        "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";
      var playStore = playStoreIntent;
      var intentLink =
        "intent://pair" +
        (payload ? "?" + payload : "") +
        "#Intent;scheme=scored;package=" +
        appId +
        ";S.browser_fallback_url=" +
        encodeURIComponent(playStoreSearch) +
        ";end";

      function scheduleRedirect(url, delay, allowWhenResumed) {
        var timer = setTimeout(function () {
          if (didUnload) {
            return;
          }

          // If the page spent time in background (app switch), do not fire late fallbacks.
          var elapsed = Date.now() - launchStartedAt;
          if (!allowWhenResumed && elapsed > delay + 1500) {
            return;
          }

          window.location.replace(url);
        }, delay);
        timers.push(timer);
      }

      function stopTimers() {
        for (var i = 0; i < timers.length; i++) {
          clearTimeout(timers[i]);
        }
        timers = [];
      }

      window.addEventListener("pagehide", function () {
        didUnload = true;
        stopTimers();
      });

      // Avoid reloading the same landing URL (can cause loops/freezes on some browsers).
      if (shouldAttemptAppLink) {
        window.location.replace(appLink);
      }

      if (isAndroid) {
        // Try custom scheme first to avoid browser fallback behavior from intent URLs.
        scheduleRedirect(schemeLink, 300, false);

        // If still on page, try to open Play Store app.
        scheduleRedirect(playStore, 1600, false);
        return;
      }

      if (isIOS) {
        // On iOS, attempt custom scheme and then App Store fallback.
        scheduleRedirect(schemeLink, 450, false);
        scheduleRedirect(appStoreSearchUrl, 2600, false);
        return;
      }

      // Desktop or unknown platform: keep page blank with no forced redirects.
    })();
  </script>
</body>
</html>
